# Refuses personal data and local paths: the PR's added lines, its commits' identities and
# messages, and the whole tree (scripts/check-private-strings.py; CONTRIBUTING.md, "Private
# strings"). The job name is stable, so the master ruleset can require it.
name: Private strings

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-strings:
    name: private-strings
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Self-test
        run: python3 scripts/check-private-strings.py --self-test
      - name: The tree
        run: python3 scripts/check-private-strings.py --all
      - name: The pushed commits (GitHub's squash and merge commits included)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: python3 scripts/check-private-strings.py --range "$BEFORE..$AFTER"
      - name: The PR's commits
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check-private-strings.py --range "$BASE..$HEAD"
