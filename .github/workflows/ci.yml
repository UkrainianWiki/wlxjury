# Scala specs (Testcontainers MariaDB on tmpfs) and the Jest tests, on every PR and on pushes to
# the integration branches. Plan: docs/plans/2026-11-03-ci-and-scalawiki-packages.md
# Wikimedia access is anonymous (CLAUDE.md, Testing): never pass COMMONS_* or SCALAWIKI_*
# credentials, as env or secrets, to any job here. TestConfigAnonymousSpec checks it.
name: CI

on:
  # Any base branch: stacked PRs target the PR below them, not master.
  pull_request:
  push:
    branches: [master, ukwikidev/followups]
  # Weekly on master, with MariaDB 10.11 too (the matrix below)
  schedule:
    - cron: '41 3 * * 1'   # Mondays 03:41 UTC
  workflow_dispatch:

# Read-only token. Fork PRs get a read-only one anyway; this keeps same-repo PRs the same.
permissions:
  contents: read

concurrency:
  # PRs: one group per PR, and a new push cancels the PR's older run. Everything else (pushes,
  # the weekly schedule, manual runs) gets a group per event and commit: GitHub keeps only one
  # pending run per group, so a shared group would drop runs of merged commits.
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}-{2}', github.event_name, github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Interim: the scalawiki commit wlxjury builds against (origin/page-categories). Bump it with
  # the scalawiki change; drop it once a published version is used.
  SCALAWIKI_SHA: 25951dbe1e05bc195b8719e2edbb08464f0ea932

jobs:
  test:
    name: sbt test (${{ matrix.mariadb }})
    # Pinned: Testcontainers' Docker API compatibility depends on the image's Docker Engine
    # (build.sbt, TestcontainersJavaVersion). Move deliberately, not when ubuntu-latest moves.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Production's 10.6 always; the 24.04 server's 10.11 only on pushes to master and in the
        # weekly run, until 10.11 becomes the default with the move (SharedTestDb.Image).
        mariadb: >-
          ${{ fromJSON((github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/master'))
          && '["mariadb:10.6.22", "mariadb:10.11.14"]' || '["mariadb:10.6.22"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          # Caches ~/.ivy2/cache, ~/.sbt and the Coursier cache, keyed on the build files
          cache: sbt

      - uses: sbt/setup-sbt@ecad189dd245444b9ae0a0cd5922fd938b88906f # v1.5.12

      # build.sbt's jsTest runs `npm ci` in javascript-test/ when node_modules is missing. Node 22:
      # eslint-plugin-compat 7 needs it (dependencies practices §9, T5)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: javascript-test/package-lock.json

      - name: scalawiki (interim, from source)
        uses: ./.github/actions/scalawiki
        with:
          sha: ${{ env.SCALAWIKI_SHA }}
          jdk: 17

      - name: Pull the test database image
        # Separate step so its time is not counted as test time
        run: docker pull -q "$MARIADB_IMAGE"
        env:
          MARIADB_IMAGE: ${{ matrix.mariadb }}

      - name: Compile and test
        # CLAUDE.md's options, but sbt gets 2g: a cold Test/compile (no incremental state on a
        # runner) runs out of heap at 512m. The check script keeps the full output in target/checks/
        # and prints a bounded summary; the full log is uploaded below. build.sbt forwards
        # -Dwlxjury.test.mariadb-image to the forked test JVM (SharedTestDb.Image).
        run: >-
          python3 scripts/agent-check.py --
          sbt -J-Xmx2g -J-Dfile.encoding=UTF-8 "-Dwlxjury.test.mariadb-image=$MARIADB_IMAGE"
          'set Test / javaOptions ++= Seq("-Xmx768m", "-Dfile.encoding=UTF-8")'
          Test/compile test
        env:
          MARIADB_IMAGE: ${{ matrix.mariadb }}

      # The supported browsers (.browserslistrc) against our scripts' APIs and the CSS features
      # caniuse lists, in seconds and without a browser (UI practices §6.1a), with its self-test.
      # After the tests and whatever they did, so that a lint failure never hides the suite's
      # result; node_modules is jsTest's, or installed here if sbt stopped before it
      - name: Compatibility lint
        if: success() || failure()
        run: |
          [ -d javascript-test/node_modules ] || npm --prefix javascript-test ci --no-audit --no-fund
          npm --prefix javascript-test run lint
          npm --prefix javascript-test run lint:selftest

      # The story coverage matrix (testing practices §9.4), in seconds, without a build: a story
      # ID that the catalogue lacks or retired, or a malformed one, fails here; the matrix goes to
      # the job's summary. After the tests, as the lint, so a tag typo never hides the suite's
      # result; in the first matrix leg only, so the summary has it once. Its self-test first.
      - name: Story coverage
        if: (success() || failure()) && strategy.job-index == 0
        run: |
          python3 scripts/story-coverage.py --self-test
          python3 scripts/story-coverage.py > /dev/null

      - name: End of the log
        if: failure()
        run: tail -n 400 target/checks/*.log

      - name: Upload reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # ':' is not allowed in artifact names; the job index tells the matrix entries apart
          name: test-reports-${{ strategy.job-index }}-attempt-${{ github.run_attempt }}
          path: |
            target/test-reports/
            target/checks/
            hs_err_pid*.log
          if-no-files-found: warn
          retention-days: 14
