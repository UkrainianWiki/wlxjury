# The deployment tool's tests (docs/deployment.md, "Local verification"): the Python unit tests,
# shellcheck, and the integration tests in the disposable Ubuntu + MariaDB 10.6 image against the
# packaged release (sbt dist). The sbt specs of that list run in ci.yml's full suite.
# Plan: docs/plans/2026-11-03-ci-and-scalawiki-packages.md
# Wikimedia access is anonymous (CLAUDE.md, Testing): never pass COMMONS_* or SCALAWIKI_*
# credentials, as env or secrets, to any job here. TestConfigAnonymousSpec checks it.
name: Deployment tests

on:
  pull_request:
    # What the scripts and the packaged release depend on; the rest of the app is covered by ci.yml
    paths:
      - scripts/deployment/**
      - conf/**
      - project/**
      - build.sbt
      - app/controllers/ReadinessController.scala
      - .github/workflows/deployment.yml
      - .github/actions/scalawiki/**
  push:
    branches: [master, ukwikidev/followups]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SCALAWIKI_SHA: 25951dbe1e05bc195b8719e2edbb08464f0ea932

jobs:
  scripts:
    name: Python unit tests and shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests on Python 3.8, the oldest supported
        run: >-
          docker run --rm --network none
          --mount type=bind,source="$PWD",target=/workspace,readonly
          --workdir /workspace/scripts/deployment
          python:3.8-slim python -B -m unittest -v test_deployment
      - name: shellcheck
        run: >-
          docker run --rm
          --mount type=bind,source="$PWD/scripts/deployment",target=/s,readonly
          koalaman/shellcheck:stable -S style /s/wlxjury-release.sh

  release:
    name: Restore and release-script tests on the packaged release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: scalawiki (interim, from source)
        uses: ./.github/actions/scalawiki
        with:
          sha: ${{ env.SCALAWIKI_SHA }}
      - name: sbt dist
        run: python3 scripts/agent-check.py -- sbt -J-Xmx1g -J-Dfile.encoding=UTF-8 dist
      - name: Build the test image (Ubuntu 22.04, MariaDB 10.6, OpenJDK 17)
        run: docker build -q -f scripts/deployment/Dockerfile.test -t wlxjury-deployment-test:local scripts/deployment
      - name: Restore and release-script tests
        # test_database_restore's packaged-release test reads target/universal/wlxjury-<version>.zip
        run: >-
          docker run --rm --network none
          --mount type=bind,source="$PWD",target=/workspace,readonly
          --workdir /workspace/scripts/deployment
          wlxjury-deployment-test:local -B -m unittest -v test_database_restore test_release_script
      - name: End of the log
        if: failure()
        run: tail -n 200 target/checks/*.log || true
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/checks/
          if-no-files-found: ignore
          retention-days: 14
