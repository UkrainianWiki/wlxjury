# The browser tests (browser-test/, docs/testing/practices.md §10): Playwright on desktop
# Chromium, Firefox and WebKit, one job per engine in parallel, on every PR and on pushes to the
# integration branches, each against its own UiShotsServer fixture. GitHub's job duration is the
# number to decide on which engines stay per PR; each job's summary adds its steps' times.
# Wikimedia access is anonymous (CLAUDE.md, Testing): never pass COMMONS_* or SCALAWIKI_*
# credentials, as env or secrets, to any job here. TestConfigAnonymousSpec checks it. The tests
# stub Commons and refuse every other host, so they need no network but this runner's.
# Actions are pinned by commit SHA, the release as a comment (dependencies practices §2.2).
name: Browser tests

on:
  pull_request:
  push:
    branches: [master, ukwikidev/followups]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}-{2}', github.event_name, github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser:
    name: browser tests (${{ matrix.engine }})
    # Pinned, as ci.yml: Testcontainers' Docker API compatibility depends on the runner's engine
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - name: Start the clock
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
          cache: sbt

      - uses: sbt/setup-sbt@ecad189dd245444b9ae0a0cd5922fd938b88906f # v1.5.12

      # Node 22, as ci.yml (dependencies practices §9, T5)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: browser-test/package-lock.json

      - name: scalawiki (interim, from source)
        uses: ./.github/actions/scalawiki
        with:
          jdk: 17

      # The fixture's database image: SharedTestDb.Image's default, read from its exact line
      - name: The fixture's database image
        run: |
          image=$(sed -nE 's/^[[:space:]]*val Image: String = sys\.props\.getOrElse\("wlxjury\.test\.mariadb-image", "(mariadb:[0-9.]+)"\)[[:space:]]*$/\1/p' test/db/scalikejdbc/SharedTestDb.scala)
          test "$(printf '%s\n' "$image" | grep -c .)" = 1
          echo "MARIADB_IMAGE=$image" >> "$GITHUB_ENV"
          docker pull -q "$image"

      # The Gatling fixture's dump (GatlingDbCache): built from the CSVs on a miss (about 1.5
      # minutes), keyed on what GatlingDbCache.cacheKey hashes. Saved right after the fixture
      # starts, so a failed test run still keeps it. A stacked PR's first runs are cold: a run
      # reads only its own branch's and its base branch's caches.
      - name: Restore the fixture's dump
        id: dump
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: data/cache
          key: gatling-fixture-${{ env.MARIADB_IMAGE }}-${{ hashFiles('conf/db/migration/default/*.sql', 'data/*.csv', 'test/gatling/setup/GatlingDbCache.scala', 'test/gatling/setup/GatlingDbSetup.scala', 'test/resources/gatling-perf.conf') }}

      - name: Install the test tools
        working-directory: browser-test
        run: npm ci

      # The dead proxy's error texts, per engine and platform, against what each gave (seconds)
      - name: Check the proxy-error patterns
        working-directory: browser-test
        run: npm run check:proxy-errors

      # Playwright's own build of the engine, for the version in package-lock.json
      - name: Restore the browser
        id: browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.engine }}-${{ hashFiles('browser-test/package-lock.json') }}

      - name: Install the browser
        working-directory: browser-test
        env:
          ENGINE: ${{ matrix.engine }}
          CACHED: ${{ steps.browsers.outputs.cache-hit }}
        run: |
          if [ "$CACHED" = true ]; then
            npx playwright install-deps "$ENGINE"
          else
            npx playwright install --with-deps "$ENGINE"
          fi

      - name: Start the fixture
        working-directory: browser-test
        timeout-minutes: 25
        run: |
          start=$(date +%s)
          node fixture-server.mjs start
          echo "SERVER_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: Save the fixture's dump
        if: steps.dump.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: data/cache
          key: ${{ steps.dump.outputs.cache-primary-key }}

      - name: Browser tests
        working-directory: browser-test
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          start=$(date +%s)
          status=0
          npx playwright test --project="$ENGINE" || status=$?
          echo "TEST_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          exit $status

      - name: Stop the fixture
        if: always()
        working-directory: browser-test
        run: node fixture-server.mjs stop || true

      # This engine's Allure results, for the report job below (testing practices §10.10)
      - name: Upload the Allure results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: allure-results-${{ matrix.engine }}-attempt-${{ github.run_attempt }}
          path: target/browser-test/allure-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Times
        if: always()
        run: |
          total=$(( $(date +%s) - JOB_START ))
          {
            echo "### Browser tests (${{ matrix.engine }})"
            echo
            echo "The steps' times; GitHub's job duration is the number to decide on."
            echo
            echo "| Part | Seconds |"
            echo "|---|---|"
            echo "| fixture start (compile, restore, serve) | ${SERVER_SECONDS:-–} |"
            echo "| tests | ${TEST_SECONDS:-–} |"
            echo "| this job's steps until here | $total |"
          } >> "$GITHUB_STEP_SUMMARY"

      # traces and screenshots of the failed tests (trace: retain-on-failure), the report and the
      # server's log; also when the job was cancelled or timed out
      - name: Upload the failures
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-failures-${{ matrix.engine }}-attempt-${{ github.run_attempt }}
          path: |
            target/browser-test/results/
            target/browser-test/report/
            target/ui-shots/server-browser-test.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the accessibility report
        if: always() && matrix.engine == 'chromium'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: accessibility-report-attempt-${{ github.run_attempt }}
          path: target/browser-test/a11y/
          if-no-files-found: ignore
          retention-days: 14

  # The three engines' results merged into one Allure report (testing practices §10.10): a test per
  # engine (its "Project" parameter), grouped by the stories its tags name. One HTML file that
  # opens offline, uploaded as an artifact only (GitHub Pages is not decided: plan
  # 2026-11-04-story-coverage.md §4.5). Advisory: its failure fails no engine's job. History: a
  # JSONL file in the Actions cache, appended only on pushes (master and ukwikidev/followups, the
  # push triggers above); a PR's report reads its base's.
  report:
    name: Allure report
    needs: browser
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: browser-test/package-lock.json

      # allure, from browser-test's lockfile (no browser is downloaded by the install)
      - name: Install the report tool
        working-directory: browser-test
        run: npm ci

      # Every attempt's results, one directory per artifact: a re-run of the failed jobs leaves the
      # passed engines' results under their earlier attempt
      - name: Download the engines' results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: allure-results-*
          path: target/browser-test/allure-attempts

      # each engine's latest attempt only, merged (result files have unique names)
      - name: Each engine's latest results
        run: |
          mkdir -p target/browser-test/allure-results
          for engine in chromium firefox webkit; do
            latest="" best=0
            for dir in target/browser-test/allure-attempts/allure-results-"$engine"-attempt-*; do
              [ -d "$dir" ] || continue
              n=${dir##*-attempt-}
              if [ "$n" -gt "$best" ]; then best=$n latest=$dir; fi
            done
            if [ -z "$latest" ]; then echo "::warning::no Allure results for $engine"; continue; fi
            echo "$engine: ${latest##*/}"
            cp -R "$latest"/. target/browser-test/allure-results/
          done

      # the newest saved history: saved under a run's key, restored by prefix
      - name: Restore the report's history
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: target/browser-test/allure-history
          key: allure-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: allure-history-

      # npm run report: allure generate, then allure-offline.mjs, which fails on an analytics
      # loader or anything loaded from another host (and adds the CSP meta), so an unchecked
      # report is never uploaded. ALLURE_NO_ANALYTICS here and in allurerc.mjs (the allure2
      # plugin honours it; testing practices §10.10).
      - name: Generate and check the report
        working-directory: browser-test
        env:
          ALLURE_APPEND_HISTORY: ${{ github.event_name == 'push' && 'true' || 'false' }}
          ALLURE_NO_ANALYTICS: 'true'
          NO_UPDATE_NOTIFIER: '1'
        run: |
          test -n "$(ls -A ../target/browser-test/allure-results 2>/dev/null)" || { echo "no Allure results"; exit 1; }
          npm run report:selftest
          npm run report
          {
            echo "### Allure report"
            echo
            echo "The \`allure-report-attempt-${{ github.run_attempt }}\` artifact: one HTML file, checked to load nothing from another host. Results: $(ls ../target/browser-test/allure-results | wc -l) files."
            echo
            echo "| File | Size |"
            echo "|---|---|"
            find ../target/browser-test/allure-report -type f -printf '| %P | %s bytes |\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save the report's history
        if: github.event_name == 'push'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: target/browser-test/allure-history
          key: allure-history-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload the report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: allure-report-attempt-${{ github.run_attempt }}
          path: target/browser-test/allure-report/
          if-no-files-found: error
          retention-days: 14
