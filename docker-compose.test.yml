services:
  mariadb:
    image: mariadb:10.6
    environment:
      MARIADB_DATABASE: wlxjury_test
      MARIADB_USER: wlxjury_user
      MARIADB_PASSWORD: wlxjury_password
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
