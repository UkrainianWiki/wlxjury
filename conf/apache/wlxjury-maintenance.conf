# Install as /etc/apache2/wlxjury-maintenance.conf and Include it INSIDE every jury
# VirtualHost, including Certbot's HTTPS vhosts, before their redirect rules.
# The directory is real; /etc/wlxjury is a package-owned symlink on production.
RewriteEngine On
RewriteCond /etc/wlxjury-runtime/maintenance -f
RewriteRule ^ - [R=503,L]
# wlxjury-deploy expects "undergoing maintenance" in this page: it tells the flag's 503
# from Apache's own 503 for a stopped app in a vhost that lacks this snippet.
ErrorDocument 503 "The jury tool is undergoing maintenance. Please try again shortly."
