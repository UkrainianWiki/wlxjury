# Include INSIDE every jury VirtualHost, including Certbot's HTTPS vhosts.
# The directory is real; /etc/wlxjury is a package-owned symlink on production.
RewriteEngine On
RewriteCond /etc/wlxjury-runtime/maintenance -f
RewriteRule ^ - [R=503,L]
ErrorDocument 503 "The jury tool is undergoing maintenance. Please try again shortly."
