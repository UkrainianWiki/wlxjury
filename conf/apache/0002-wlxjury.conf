# HTTP virtual hosts for the single wlxjury.service on 127.0.0.1:9000 (docs/deployment.md).
# Install wlxjury-maintenance.conf as /etc/apache2/wlxjury-maintenance.conf and include it
# the same way in every HTTPS vhost Certbot generated, before its own rewrite rules.
# wlxjury-deploy checks that every jury URL answers 503 before it stops anything.

<VirtualHost *:80>
    ServerName jury.wikilovesearth.org.ua
    ProxyPreserveHost On
    ProxyPass    /excluded ! retry=0
    ProxyPass    / http://127.0.0.1:9000/ retry=0
    ProxyPassReverse / http://127.0.0.1:9000/
    Include /etc/apache2/wlxjury-maintenance.conf
    RewriteCond %{SERVER_NAME} =jury.wikilovesearth.org.ua
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

