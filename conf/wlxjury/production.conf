# Install outside the package, at /etc/wlxjury-runtime/production.conf.
# Explicit classpath include: an upgrade always supplies its own defaults.
include required(classpath("application.conf"))

play.http.secret.key = ${PLAY_HTTP_SECRET_KEY}
db.default.url = "jdbc:mariadb://"${WLXJURY_DB_HOST}"/"${WLXJURY_DB}"?autoReconnect=true&autoReconnectForPools=true&useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true"
db.default.username = ${WLXJURY_DB_USER}
db.default.password = ${WLXJURY_DB_PASSWORD}
commons.user = ${?COMMONS_USER}
commons.password = ${?COMMONS_PASSWORD}

# Flyway 8.0.1 maps initOnMigrate to baselineOnMigrate. Preserve real history;
# never silently initialize an existing database or clean it after a failure.
db.default.migration {
  auto = true
  initOnMigrate = false
  validateOnMigrate = true
  cleanDisabled = true
  cleanOnValidationError = false
  ignoreMigrationPatterns = []
}
wlxjury.host = "https://jury.wle.org.ua/"

