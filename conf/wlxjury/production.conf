# Install outside the package, at /etc/wlxjury-runtime/production.conf.
# Explicit classpath include: an upgrade always supplies its own defaults.
include required(classpath("application.conf"))

play.http.secret.key = ${PLAY_HTTP_SECRET_KEY}
db.default.url = "jdbc:mariadb://"${WLXJURY_DB_HOST}"/"${WLXJURY_DB}"?autoReconnect=true&autoReconnectForPools=true&useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true"
db.default.username = ${WLXJURY_DB_USER}
db.default.password = ${WLXJURY_DB_PASSWORD}
commons.user = ${?COMMONS_USER}
commons.password = ${?COMMONS_PASSWORD}

# Flyway 8.0.1 maps initOnMigrate to baselineOnMigrate. Preserve real history;
# never silently initialize an existing database or clean it after a failure.
db.default.migration {
  auto = true
  initOnMigrate = false
  validateOnMigrate = true
  cleanDisabled = true
  cleanOnValidationError = false
  ignoreMigrationPatterns = []
}
wlxjury.host = "https://jury.wle.org.ua/"

# The host names Apache serves the jury tool at (each vhost's ServerName; the vhosts keep the
# client's Host with ProxyPreserveHost On), comma-separated: required. A request whose Host
# isn't one of them, or loopback, gets a 400 page (play.filters.hosts.AllowedHostsFilter,
# modules.AllowedHostsModule). Loopback: the deploy tools' readiness checks ask
# http://127.0.0.1:9000/health/ready.
wlxjury.allowedHosts = ${WLXJURY_ALLOWED_HOSTS}
play.filters.hosts.allowed = ["127.0.0.1", "localhost"]

# Browsers reach the app over HTTPS only (Apache), so its cookies are sent over HTTPS only:
# the session, the flash, the language (PLAY_LANG) and the theme cookie (controllers.ThemeCookies,
# which follows the session's setting). Play needn't see the request as secure for this; Apache
# on loopback is a trusted proxy (play.http.forwarded.trustedProxies, Play's default), so an
# X-Forwarded-Proto it sends is believed.
play.http.session.secure = true
play.http.flash.secure = true
play.i18n.langCookieSecure = true
