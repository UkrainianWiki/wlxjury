# This is the main configuration file for the application.
# ~~~~~

# Secret key
# ~~~~~
# The secret key is used to secure cryptographics functions.
# If you deploy your application to several instances be sure to use the same key!
play.http.secret.key = "changeme"
play.http.secret.key = ${?PLAY_HTTP_SECRET_KEY}

# The application languages
# ~~~~~
play.i18n.langs = ["en", "fr", "uk", "ru"]

# Global object class
# ~~~~~
# Define the Global object class for this application.
# Default to Global in the root package.
# application.global=Global

# Router
# ~~~~~
# Define the Router object to use for this application.
# This router will be looked up first when the application is starting up,
# so make sure this is the entry point.
# Furthermore, it's assumed your route file is named properly.
# So for an application router like `my.application.Router`,
# you may need to define a router file `conf/my.application.routes`.
# Default to Routes in the root package (and conf/routes)
# application.router=my.application.Routes

# Database configuration
# ~~~~~
# You can declare as many datasources as you want.
# By convention, the default datasource is named `default`
#

# A bot password (User@name, Special:BotPasswords with "High-volume (bot) access") of a
# Commons account in the bot group: the import jobs log in with it and then fetch 500
# files per request instead of 50 (apihighlimits). Unset: anonymous requests.
commons.user = ${?COMMONS_USER}
commons.password = ${?COMMONS_PASSWORD}
commons.host=commons.wikimedia.org
wlxjury.thumbs.local-path="/var/www/jury-images"
wlxjury.thumbs.parallelism=2
wlxjury.thumbs.rate-per-second=10
wlxjury.thumbs.max-attempts=3

db.default.driver = org.mariadb.jdbc.Driver
db.default.url = "jdbc:mariadb://"${WLXJURY_DB_HOST}"/"${WLXJURY_DB}"?autoReconnect=true&autoReconnectForPools=true&useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true"
#db.default.url = "jdbc:mariadb://jury.wikilovesearth.org.ua/wlxjury?&useUnicode=true&characterEncoding=UTF-8"

db.default.username = ${WLXJURY_DB_USER}
db.default.password = ${WLXJURY_DB_PASSWORD}

#db.default.hikaricp.file="conf/hikaricp.properties"
dbplugin = disabled

# Connection pool: Play's HikariCP pool, which scalikejdbc.PlayDBApiAdapterModule
# registers as ScalikeJDBC's "default" pool (ConnectionPoolConfigSpec checks it).
# Neither scalikejdbc.PlayModule nor scalikejdbc.PlayFixtureModule is enabled: both start
# PlayInitializer, which registers a commons-dbcp2 pool of ScalikeJDBC's defaults (8
# connections) as "default" too, and whichever module started last won. The old
# BoneCP-style keys (minPoolSize, maxPoolSize, ...) were read by neither: the pool ran
# with HikariCP's default maximum of 10.
db.default.hikaricp.minimumIdle = 10
db.default.hikaricp.maximumPoolSize = 30
db.default.hikaricp.connectionTimeout = 30 seconds

# Round creation no longer distributes images in the request (a background job, see
# jobs below), so no request runs for minutes any more. The 5 minutes stay as a margin for
# the remaining slow pages.
play.server.http.idleTimeout = 5 minutes

play.application.loader = "modules.LogSdtErrLoader"

play.modules.enabled += "scalikejdbc.PlayDBApiAdapterModule"
play.modules.enabled += "org.flywaydb.play.PlayModule"
play.modules.enabled += "modules.AppModule"

# The webjars' files (controllers.WebJars) have their version in their path: cache them for a year
play.assets.cache."/META-INF/resources/webjars/" = "public, max-age=31536000, immutable"

# connect-src: the category fields' suggestions (category-suggest.js) fetch from the Commons API
play.filters.headers.contentSecurityPolicy = "default-src 'self' 'unsafe-eval' 'unsafe-inline'; img-src 'self' data: https://*; media-src 'self' https://*; connect-src 'self' https://commons.wikimedia.org"
play.filters.disabled += "play.filters.hosts.AllowedHostsFilter"
# A request the CSRF filter refuses: a page saying to reload it (JSON for scripts)
play.filters.csrf.errorHandler = "CsrfErrorHandler"

scalikejdbc.global.loggingSQLAndTime.enabled = true
scalikejdbc.global.loggingSQLAndTime.logLevel = info
scalikejdbc.global.loggingSQLAndTime.warningEnabled = true
scalikejdbc.global.loggingSQLAndTime.warningThresholdMillis = 1000
scalikejdbc.global.loggingSQLAndTime.warningLogLevel = warn

email.host = localhost

wlxjury.host = "https://jury.wle.org.ua/"

wlxjury.greeting = """Hello, {{RecipientName}}!

Organizing committee of {{ContestType}} {{ContestYear}} {{ContestCountry}} is glad to welcome you as a jury member.

Please login to our jury tool {{JuryToolLink}}
with login: {{Login}} and password: {{Password}}

Best regards,

{{AdminName}}"""

play.mailer {
  host = "localhost"
  #  port (defaults to 25)
  #  ssl (defaults to no)
  #  tls (defaults to no)
  #  user (optional)
  #  password (optional)
  #  debug (defaults to no, to take effect you also need to set the log level to "DEBUG" for the application logger)
  #  timeout (defaults to 60s in milliseconds)
  #  connectiontimeout (defaults to 60s in milliseconds)
  #  mock (defaults to no, will only log all the email properties instead of sending an email)
}

application.global=controllers.Global

# Slow, blocking DB work (galleries, /roundstat, round edit/save, the REST API): see
# modules.BlockingExecutionContext. 8 threads (4 per CPU of a 2-CPU server shared with
# MariaDB): these queries are CPU-bound, so more of them at once only queue in MariaDB
# and slow down everything else. Measured on the Gatling fixture, 20 organizers polling
# /roundstat with no pause while jurors vote: votes took 3.6 s (mean) with 32 threads,
# 1.2 s with 16, 26 ms with 8, at the same /roundstat throughput; logins 8-10 s, 7.5 s,
# 40-60 ms. It also stays well below the DB pool's 30 connections, next to the 8 threads
# of Play's default dispatcher (Pekko's parallelism-min).
blocking-dispatcher {
  type = Dispatcher
  executor = "thread-pool-executor"
  thread-pool-executor {
    fixed-pool-size = 8
  }
  throughput = 1
}

# Sign-in and sign-up (modules.SignInExecutionContext): each checks or computes a bcrypt
# hash, about 0.25 s of CPU at cost 12, and may wait for a turn (bcrypt.*).
# More threads than turns, so that a sign-in waiting for its turn doesn't delay the next
# one's DB lookup; the wait is bounded by bcrypt.maxWait.
sign-in-dispatcher {
  type = Dispatcher
  executor = "thread-pool-executor"
  thread-pool-executor {
    fixed-pool-size = 4
  }
  throughput = 1
}

# Password hashes (services.PasswordHasher): bcrypt $2b$. Not under a "password" key,
# which the deployment script's credential scan would read as a literal credential.
#  - cost: of new hashes; a stored hash is checked at its own cost, and one of a lower cost
#    is rehashed on sign-in. Below 10 only with allowLowCost (the tests' config).
#  - maxConcurrent: bcrypt computations at once. The server has 2 CPUs shared with MariaDB:
#    a flood of sign-ins uses at most these, the others wait.
#  - maxWait: how long a sign-in waits for its turn before the page asks to try again.
#  - maxQueued: sign-ins and sign-ups in flight (queued or running) at most; more get
#    503 at once, so that a flood never builds a queue that outlasts it.
bcrypt {
  cost = 12
  maxConcurrent = 2
  maxWait = 10 seconds
  maxQueued = 50
}

# Background jobs (services.jobs.JobScheduler): long work, such as distributing a round's
# images, runs as jobs of short steps on these threads, never on a request thread.
#  - workers: steps running at once, over all kinds. The server has 2 CPUs shared with
#    MariaDB; a distribution step is mostly MariaDB work (a keyset read and an insert).
#  - concurrency.<kind>: steps of one kind at once. Jobs take turns, one step each, so a
#    small round finishes in seconds while a big one runs.
#  - lease: a running job whose instance stops renewing it (a crash) is taken over after
#    this long; a graceful stop hands its jobs back at once.
# The contest files page's region counts, cached in memory (db.scalikejdbc.RegionCountCache)
# and invalidated by the writes that change them. false: read on every view.
regions.countCache = true

# Round galleries' region navs with their regions' file counts: off, juror (a juror's own
# gallery), all (also the organisers' whole-round views). See
# docs/plans/2026-10-25-region-improvements.md for the measurements.
gallery.regionCounts = all

jobs {
  mode = background
  workers = 2
  # threads for the external API calls of import jobs, made before each of their steps:
  # off the workers, so a slow API doesn't hold up the database work
  fetchWorkers = 2
  defaultConcurrency = 1
  concurrency {
    round_distribution = 2
    # one request at a time to Commons, as the API etiquette asks
    commons_image_import = 1
    # and one to the monument lists' wiki
    monument_list_import = 1
  }
  pollInterval = 2 seconds
  heartbeatInterval = 10 seconds
  lease = 60 seconds
  # selection rows per distribution step (one transaction); see the plan's 13.7 measurements
  roundDistribution.chunkRows = 15000
  # files per import step; unset: as many as one request of their details takes, 500
  # with the Commons account's apihighlimits (commons.user), 50 without
  # commonsImport.pageSize = 50
  # monument list pages per step (large: hundreds of monuments each)
  monumentImport.pageSize = 20
}

# Raise Pekko HTTP's response reason-phrase limit (default 64) to handle
# Wikimedia upload servers that return longer reason phrases.
pekko.http.client.parsing.max-response-reason-length = 256
pekko.http.client.parsing.illegal-header-warnings = off
pekko.http.parsing.max-to-strict-bytes = 50m
