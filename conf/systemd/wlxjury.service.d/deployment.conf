# Install at /etc/systemd/system/wlxjury.service.d/deployment.conf.
# No secrets or per-release paths belong in this file.
[Service]
EnvironmentFile=/etc/default/wlxjury
EnvironmentFile=/etc/wlxjury-runtime/runtime.env
WorkingDirectory=/opt/wlxjury/current
ExecStart=
ExecStart=/opt/wlxjury/current/bin/wlxjury -Dconfig.file=/etc/wlxjury-runtime/production.conf -Dlogger.file=/etc/wlxjury-runtime/logback.xml -Dhttp.address=127.0.0.1 -Dhttp.port=9000 -Dpidfile.path=/run/wlxjury/play.pid
RuntimeDirectory=wlxjury
LogsDirectory=wlxjury
TimeoutStopSec=360
KillMode=control-group
Restart=on-failure
RestartSec=5
