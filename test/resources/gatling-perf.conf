gatling {
  users           = 20
  rampUpSeconds   = 10
  durationSeconds = 60
  jurorFraction   = 0.5
  maxRate         = 10
}

gatling {
  quick = false
  quickUsers           = 3
  quickRampUpSeconds   = 3
  quickDurationSeconds = 10
}

# Round management (RoundManagementSimulation). Separate from gatling.users: that key
# also sets the fixture's juror count and the DB-dump cache key.
gatling {
  roundMgmt {
    stress               = false  # true = old worst case (stressUsers sessions, no think time)
    organizers           = 3      # concurrent organizer sessions (accounts organizer, organizer2, ...)
    rampUpSeconds        = 10
    durationSeconds      = 180    # each organizer loops for this long; use 300 for before/after comparisons
    quickDurationSeconds = 30
    pauseScale           = 0.25   # multiplies human think times; 1.0 = real pace, 0 = no pauses
    createRound          = false  # one round creation per simulation
    stressUsers          = 20
    stressRepeat         = 20
  }

  # Organizers watching juror progress on /roundstat (AggregatedRatingsSimulation).
  aggRatings {
    stress               = false  # true = old worst case (stressUsers sessions, no think time)
    withVoting           = false  # also run VotingSimulation's jurors at the same time
    organizers           = 3
    rampUpSeconds        = 10
    durationSeconds      = 180
    quickDurationSeconds = 30
    pauseScale           = 0.25
    stressUsers          = 20
    stressRepeat         = 20
  }

  # A juror clicking through files (JurorClickSimulation): gallery page, large view, votes
  # (POST and redirect to the next file's large view), Esc back to the gallery.
  clicks {
    stress               = false  # true = sessions as JurorGallerySimulation's, one visit each, no pauses
    jurors               = 30     # concurrent juror sessions (two to an account above the fixture's 20)
    rampUpSeconds        = 10
    durationSeconds      = 180
    quickDurationSeconds = 30
    pauseMinSeconds      = 2      # think time between clicks
    pauseMaxSeconds      = 5
    votesPerVisit        = 5
  }

  # Round creation and image distribution (RoundDistributionSimulation): one organizer,
  # sequential steps, each a real POST /admin/rounds/save.
  distribution {
    jurorsPerImage = 3      # the round form's "distribution": jurors per image
    fromRated      = false  # also create a round from the rated round's top images
    topImages      = 100
    topUp          = false  # also save the first round with "distribute new files" (a no-op top-up)
    iterations     = 1      # each iteration creates new rounds
    timeoutMinutes = 15     # per step: a distribution can take minutes
    pollMillis     = 200    # how often a step polls its job's status (GET /admin/jobs/:id)
  }

  # The app's background job scheduler (application.conf jobs.*), for the measurements
  jobs {
    workers                 = 2
    distributionConcurrency = 2
    chunkRows               = 15000
  }

  # Many admins creating rounds at the same moment (ConcurrentRoundCreationSimulation):
  # 2 large first rounds from the contest category, 4 region rounds (small, like special
  # nominations: a full scan, few images), 2 top-N rounds and a min-average round from the
  # rated round, and "distribute new files" on the binary round; jurors vote and browse
  # the binary round meanwhile.
  concurrent {
    admins          = 10
    jurorsPerImage  = 3
    soloFirst       = true   # first each small job alone, one after another: the reference times
    withVoting      = true
    voterUsers      = 20     # juror sessions arriving per 10 s (as VotingSimulation's users)
    durationSeconds = 120    # voting and browsing go on this long from the admins' submit
    pollMillis      = 250
    timeoutMinutes  = 30
  }
}

# Where the simulations run. "fixture": a TestServer in the Gatling JVM on a generated
# fixture in a MariaDB testcontainer. "external": an app that is already running, e.g. the
# production-like benchmark server (bench/scripts/bench.sh), on whatever data its database
# holds; the contest and rounds below are read from it (GatlingExternalTarget).
gatling {
  target = "fixture"
  external {
    baseUrl = "http://localhost:19000"
    db {
      url      = "jdbc:mariadb://localhost:13306/wlxjury"
      user     = "wlxjury"
      password = "wlxjury"
    }
    # Wiki Loves Monuments 2025 in Ukraine, re-opened by bench/scripts/reopen-contest.sql:
    # its largest binary round and its largest rated round.
    contestId     = 603
    binaryRoundId = 1721
    ratedRoundId  = 1775
    passwordPrefix = "bench"   # bench/scripts/anonymise.sql: every password is bench<id>
  }
}
