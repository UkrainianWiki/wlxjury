gatling {
  users           = 20
  rampUpSeconds   = 10
  durationSeconds = 60
  jurorFraction   = 0.5
  maxRate         = 10
}

gatling {
  quick = false
  quickUsers           = 3
  quickRampUpSeconds   = 3
  quickDurationSeconds = 10
}

# Round management (RoundManagementSimulation). Separate from gatling.users: that key
# also sets the fixture's juror count and the DB-dump cache key.
gatling {
  roundMgmt {
    stress               = false  # true = old worst case (stressUsers sessions, no think time)
    organizers           = 3      # concurrent organizer sessions (accounts organizer, organizer2, ...)
    rampUpSeconds        = 10
    durationSeconds      = 180    # each organizer loops for this long; use 300 for before/after comparisons
    quickDurationSeconds = 30
    pauseScale           = 0.25   # multiplies human think times; 1.0 = real pace, 0 = no pauses
    createRound          = false  # one round creation per simulation
    stressUsers          = 20
    stressRepeat         = 20
  }

  # Organizers watching juror progress on /roundstat (AggregatedRatingsSimulation).
  aggRatings {
    stress               = false  # true = old worst case (stressUsers sessions, no think time)
    organizers           = 3
    rampUpSeconds        = 10
    durationSeconds      = 180
    quickDurationSeconds = 30
    pauseScale           = 0.25
    stressUsers          = 20
    stressRepeat         = 20
  }
}
