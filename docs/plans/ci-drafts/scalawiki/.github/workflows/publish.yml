# DRAFT for UkrainianWiki/scalawiki (goes to .github/workflows/publish.yml there, with
# ../../publishing.diff applied). Plan: wlxjury docs/plans/2026-11-03-ci-and-scalawiki-packages.md
#
# Publishes http-extensions, scalawiki-core, scalawiki-dumps and scalawiki-wlx (Scala 2.13) to
# GitHub Packages when a version tag is pushed: `git tag -a 0.7.0-M1 -m 0.7.0-M1 <commit>`,
# then `git push origin 0.7.0-M1`. A version is published once and never replaced: a fix is a
# new tag. The packages are linked to this repository and inherit its (public) visibility.
name: Publish

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+*']   # 0.7.0, 0.7.0-M1, 0.7.1-RC1; plain, like the 0.6.x tags

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # sbt-dynver reads the tags
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17   # scalawiki's baseline since its java17 branch (-release:17; the build refuses older JDKs)
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: The version is the tag
        # dynverAssertTagVersion only checks that the version comes from a tag: with two tags on
        # one commit, git describe may pick the other one. So the version must equal the pushed
        # tag, and not be a snapshot (a dirty tree or commits after the tag): never publish one.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sbt -batch dynverAssertTagVersion
          version="$(sbt -batch -error 'print scalawiki-core/version' | tail -n 1 | tr -d '[:space:]')"
          snapshot="$(sbt -batch -error 'print scalawiki-core/isSnapshot' | tail -n 1 | tr -d '[:space:]')"
          [ "$version" = "$TAG" ] || { echo "::error::version $version is not the tag $TAG"; exit 1; }
          [ "$snapshot" = false ] || { echo "::error::$version is a snapshot"; exit 1; }

      # Anonymous (anonymous-tests.diff): no SCALAWIKI_LOGIN / SCALAWIKI_PASSWORD or other wiki
      # credentials anywhere in this workflow; live-wiki specs stay off (no -Dscalawiki.live).
      - name: Test
        run: sbt -batch test

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # publish / skip excludes the aggregate and scalawiki-bots (build.sbt)
        run: sbt -batch publish
