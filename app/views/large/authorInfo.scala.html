@(image: org.intracer.wmua.Image, user: db.scalikejdbc.User)(implicit messages: Messages)
@* The account, as plain text (StoredAuthors.shown): never an older import's raw wikitext. *@
@for(author <- services.imports.StoredAuthors.shown(image.author)) {
    <div id="author" class="card card-body large-box">
        @Messages("author"): @author
    </div>
}
