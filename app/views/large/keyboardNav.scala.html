@import org.intracer.wmua.ImageWithRating
@import db.scalikejdbc.User

@(user: User,
  list: RoundList,
  files: Seq[ImageWithRating],
  index: Int)(implicit request: Request[Any], messages: Messages)
<script src="@routes.Assets.at("javascripts/jquery.hotkeys.js")"></script>
@defining(list.round) { round =>
@defining(files(index).pageId) { pageId =>
<script>
    @if(index < files.size-1) {
    $(document).on('keydown', null, 'down', function (e) {
        e.preventDefault() ;
        window.location = "@Html(list.largeUrl(files(index + 1).pageId))";
        return false;
    });
    }

    @if(index > 0) {
    $(document).on('keydown', null, 'up', function (e) {
        e.preventDefault() ;
        window.location = "@Html(list.largeUrl(files(index - 1).pageId))";
        return false;
    });
    }

    $(document).on('keydown', null, 'esc', function (e) {
        e.preventDefault() ;
        window.location = "@Html(list.atUrl(pageId))";
        return false;
    });

    $(document).on('keydown', null, 'pagedown', function (e) {
        e.preventDefault() ;
        window.location = "@Html(list.largeUrl(files(math.min(index + 5, files.size - 1)).pageId))";
        return false;
    });
    $(document).on('keydown', null, 'pageup', function (e) {
        e.preventDefault() ;
        window.location = "@Html(list.largeUrl(files(math.max(index - 5, 0)).pageId))";
        return false ;
    });

    $(document).on('keydown', null, 'home', function (e) {
        e.preventDefault() ;
        window.location = "@Html(list.largeUrl(files(0).pageId))";
        return false ;
    });

    $(document).on('keydown', null, 'end', function (e) {
        e.preventDefault() ;
        window.location = "@Html(list.largeUrl(files.last.pageId))";
        return false ;
    });

    @if(user.getId == list.asUserId && round.active && user.roles.contains("jury")) {
        @if(round.isBinary) {
            @if(files(index).rate <= 0) {
                $(document).on('keydown', null, 'space', function (e) {
                    e.preventDefault() ;
                    voteLarge("@Html(list.voteUrl(pageId, 1))");
                    return false ;
                });
            }
            @if(files(index).rate >= 0) {
                $(document).on('keydown', null, 'del', function (e) {
                    e.preventDefault() ;
                    voteLarge("@Html(list.voteUrl(pageId, -1))");
                    return false ;
                });
            }
        } else {
            @for(i <- 0 to Math.min(round.rates.id, 9)) {
                $(document).on('keydown', null, '@i', function (e) {
                    e.preventDefault() ;
                    voteLarge("@Html(list.voteUrl(pageId, i))");
                    return false ;
                });
            }
        }
    }
</script>
}
}
