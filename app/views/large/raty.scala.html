@(list: RoundList)
@* A rated round's large view's stars: raty, the number above them (large-rate.js) and
   large-stars.js, which draws them from navigationButtons.scala.html's attributes. Goes in the
   shell's `head`. *@
@if(!list.round.isBinary) {
    <script src="@routes.Assets.versioned("javascripts/jquery.raty.js")"></script>
    <script src="@routes.Assets.versioned("javascripts/large-rate.js")"></script>
    <script src="@routes.Assets.versioned("javascripts/large-stars.js")"></script>
}
