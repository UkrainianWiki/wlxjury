@* A textarea, as b3.textarea (`rows`, `cols` etc. are attributes) *@
@(field: Field, args: (Symbol, Any)*)(implicit layout: Layout, messages: MessagesProvider)
@f = @{ new FieldView(field, args, "form-control") }
@fieldGroup(f) {
<textarea id="@f.id" name="@f.name" class="@f.inputClass"@for(d <- f.describedBy) { aria-describedby="@d"} @f.attrs()>@f.value.getOrElse("")</textarea>
}
