<script>
// A vote is a POST of the page's vote form, with its CSRF token: a GET changes nothing.
// The keys, the stars and the buttons with a data-vote-url submit it.
function voteLarge(url) {
var form = document.getElementById('vote-form');
if (!form) return;
form.action = url;
form.submit();
}
$(document).on('click', '[data-vote-url]', function (e) {
e.preventDefault();
voteLarge($(this).attr('data-vote-url'));
});
</script>

cancel: true,
starHalf: 'star-half-big.png ',
starOff: 'star-off-big.png ',
starOn: 'star-on-big.png ',
cancelOff: 'cancel-off-big.png ',
cancelOn: 'cancel-on-big.png ',
number: 5,
precision: false,
space: false,
hints:[ '', '', '', '', '', '', '', '', '', '' ],
click : function(score, evt) {
voteLarge('/large/round/1/pageid/107/select/' + Math.round(score*1) + '?sort=rate');
return false;
}
});
})
</script>
