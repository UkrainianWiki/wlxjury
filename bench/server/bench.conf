# The app's own conf/application.conf (in the dist, on the classpath), with only what a
# benchmark needs changed. The DB comes from the WLXJURY_DB_* environment, as on production.
include classpath("application.conf")

# Gatling posts forms without CSRF tokens (as the Gatling fixture's TestServer allows).
play.filters.csrf.method.whiteList = ["GET", "HEAD", "OPTIONS", "POST"]

# Prod mode refuses the repository's placeholder secret.
play.http.secret.key = "wlxjury-benchmark-secret-not-used-anywhere-else-0123456789"

# Job settings for runs that vary them (the background-distribution code only); unset
# variables keep application.conf's values.
jobs.workers = ${?BENCH_JOBS_WORKERS}
jobs.roundDistribution.chunkRows = ${?BENCH_JOBS_CHUNK_ROWS}

# Apply pending Flyway migrations at startup, as a deploy does (flyway-play refuses to start
# in prod mode with pending migrations otherwise).
db.default.migration.auto = true
